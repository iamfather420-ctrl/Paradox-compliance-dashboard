name: DFRL Sovereign Formal Verification & CI Gate

on:
  push:
    branches: ["main", "fix/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  formal-verification:
    runs-on: ubuntu-latest
    name: Machine-Evidence Proof Verification (Z3 WASM)
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Install Dependencies from bun.lock
        run: bun install --frozen-lockfile
      - name: TypeScript Static Lint Gate
        run: bun run lint
      - name: Execute Live Z3 Proof Verifier
        run: bun run verify:proofs
      - name: Generate DFRL Audit Dossier
        run: bun run verify:dfrl
      - name: Execute Enterprise Security & Anti-Fabrication Tests
        run: bun run verify:enterprise
      - name: Compile & Build Application
        run: bun run build
